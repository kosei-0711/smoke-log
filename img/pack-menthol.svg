<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="320" height="512">
  <!-- オリジナルの「メンソール」パッケージ（実在ブランドのロゴ・デザインは使用していません） -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17a87e"/>
      <stop offset="1" stop-color="#0a5c45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb5ad"/>
      <stop offset=".5" stop-color="#eef4f2"/>
      <stop offset="1" stop-color="#9fb5ad"/>
    </linearGradient>
  </defs>

  <!-- 本体 -->
  <rect width="320" height="512" fill="url(#body)"/>
  <!-- 上部の白い帯（フタ部分） -->
  <rect width="320" height="128" fill="#f3f6f5"/>
  <rect y="128" width="320" height="6" fill="url(#silver)"/>
  <rect y="96" width="320" height="4" fill="#17a87e" opacity=".7"/>
  <text x="160" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-style="italic" fill="#0a5c45" letter-spacing="2">Menthol</text>

  <!-- ミントの葉のエンブレム -->
  <circle cx="160" cy="252" r="66" fill="none" stroke="#e8fff6" stroke-width="4" opacity=".9"/>
  <circle cx="160" cy="252" r="56" fill="#e8fff6" opacity=".12"/>
  <path d="M160 206c40 18 44 74 0 96c-44-22-40-78 0-96z" fill="#c9f7e3"/>
  <path d="M160 214v80M160 238l-18-12M160 238l18-12M160 258l-22-12M160 258l22-12M160 278l-16-10M160 278l16-10"
        stroke="#0d7a5a" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- 文字 -->
  <text x="160" y="372" text-anchor="middle" font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="40" font-weight="900" fill="#ffffff" letter-spacing="5">MENTHOL</text>
  <text x="160" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="700" fill="#c9f7e3" letter-spacing="6">FRESH · COOL</text>

  <!-- 下部の帯 -->
  <rect y="448" width="320" height="4" fill="url(#silver)" opacity=".8"/>
  <text x="160" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="700" fill="#e8fff6" letter-spacing="4" opacity=".85">20 CIGARETTES</text>

  <!-- 光沢 -->
  <rect width="320" height="512" fill="url(#sheen)"/>
</svg>
